<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fagotti — Ordini</title>
<!-- Firebase CDN classico (no moduli) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--nero:#1a1207;--oro:#c9a84c;--oro-l:#fdf5e0;--cream:#faf8f5;--brd:#e0d8cc}
body{font-family:Georgia,serif;background:var(--cream);color:var(--nero);min-height:100vh}
#login{position:fixed;inset:0;background:var(--nero);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;z-index:9999}
#login.hidden{display:none}
.ls{color:#aaa;font-family:sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.lt{color:var(--oro);font-size:28px;font-weight:bold;letter-spacing:2px}
.li{width:100%;max-width:280px;padding:13px 18px;background:#2a1f0e;border:1px solid var(--oro);color:#fff;border-radius:12px;font-size:18px;text-align:center;letter-spacing:4px;outline:none;font-family:sans-serif}
.lb{width:100%;max-width:280px;padding:14px;background:var(--oro);color:var(--nero);border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:sans-serif}
.le{color:#f87171;font-family:sans-serif;font-size:13px;min-height:18px}
#app{display:none;flex-direction:column;min-height:100vh}
#app.on{display:flex}
.hdr{background:var(--nero);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.ht{color:#fff;font-size:20px;font-weight:bold}.hs{color:var(--oro);font-family:sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase}
.sy{font-family:sans-serif;font-size:11px;display:flex;align-items:center;gap:5px}
.nav{display:flex;background:#fff;border-bottom:2px solid var(--brd);position:sticky;top:57px;z-index:99}
.nb{flex:1;padding:12px 4px;background:transparent;color:#666;border:none;cursor:pointer;font-family:sans-serif;font-size:12px;font-weight:600}
.nb.on{background:var(--nero);color:var(--oro)}
.content{padding:14px;max-width:600px;margin:0 auto;width:100%;flex:1}
.view{display:none}.view.on{display:block}
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wb{background:#fff;border:1px solid var(--brd);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:20px;color:var(--nero)}
.wt{text-align:center}.wm{font-family:sans-serif;font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase}
.wd{font-family:sans-serif;font-size:13px;color:#444;margin-top:2px}
.dacc{margin-bottom:8px;border-radius:12px;overflow:hidden;border:1px solid var(--brd);background:#fff}
.dacc.today{border:2px solid var(--oro)}
.dtr{background:#f0ebe0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.dacc.today .dtr{background:var(--nero)}
.dn{font-weight:700;font-size:14px;font-family:sans-serif;color:var(--nero)}
.dacc.today .dn{color:var(--oro)}
.dr{display:flex;align-items:center;gap:8px}
.dc{border-radius:12px;padding:2px 10px;font-family:sans-serif;font-size:12px;font-weight:700;color:#fff;background:#ccc}
.dc.has{background:var(--oro)}
.da{font-size:14px;color:#888;transition:transform .2s;display:inline-block}
.dacc.today .da{color:#aaa}
.dbody{display:none}.dbody.open{display:block}
.or{padding:11px 14px;border-top:1px solid #f5f0e8;display:flex;justify-content:space-between;align-items:flex-start}
.oc{font-weight:700;font-size:15px}.op{font-family:sans-serif;font-size:13px;color:#555;margin-top:2px}
.obs{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.bg{font-size:10px;padding:2px 7px;border-radius:10px;font-family:sans-serif}
.bgf{background:#fef3c7;color:#92400e}.bgd{background:#fce7f3;color:#9d174d}
.bgp{background:#dcfce7;color:#166634}.bgc{background:#fff7ed;color:#9a3412}
.onote{font-family:sans-serif;font-size:11px;color:#888;margin-top:3px;font-style:italic}
.oprice{font-family:sans-serif;font-size:13px;font-weight:700;margin-top:3px}
.oa{display:flex;gap:6px;margin-left:10px;flex-shrink:0}
.bi{background:none;border:1px solid;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;min-width:36px;min-height:36px}
.be{border-color:#3b82f633;color:#3b82f6}.bd{border-color:#ef444433;color:#ef4444}
.ed{padding:10px 14px;color:#ccc;font-family:sans-serif;font-size:13px;font-style:italic}
.wtot{text-align:center;margin-bottom:14px}
.wtot span{background:var(--oro);color:#fff;border-radius:20px;padding:4px 16px;font-family:sans-serif;font-size:13px;font-weight:700}
.pc{margin-bottom:12px;border-radius:12px;overflow:hidden;border:1px solid var(--brd);background:#fff}
.ph{background:var(--nero);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.pd{color:var(--oro);font-weight:700;font-family:sans-serif;font-size:14px}
.pi2{color:#aaa;font-family:sans-serif;font-size:12px}
.pit{padding:9px 14px;border-top:1px solid #f0ebe0}
.pih{display:flex;justify-content:space-between;align-items:center}
.pn{font-weight:700;font-size:14px}.pq{background:#f0ebe0;border-radius:20px;padding:2px 12px;font-family:sans-serif;font-size:13px;font-weight:700}
.pdt{font-family:sans-serif;font-size:12px;color:#666;margin-top:3px}.pdt span{color:var(--oro)}
.tc{margin-top:8px;border-radius:12px;overflow:hidden;border:2px solid var(--oro)}
.th{background:var(--oro);padding:10px 14px}.th span{color:#fff;font-weight:700;font-family:sans-serif;font-size:14px}
.tr2{padding:8px 14px;border-top:1px solid #f0ebe0;display:flex;justify-content:space-between;font-family:sans-serif;font-size:13px;background:#fff}
.tn{font-weight:700;color:var(--oro)}
.fw{background:#fff;border-radius:16px;border:1px solid var(--brd);overflow:hidden}
.fh{background:var(--nero);padding:13px 18px}.fh span{color:var(--oro);font-family:sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.fb{padding:18px;display:flex;flex-direction:column;gap:14px}
.fl{display:block;font-family:sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:6px}
.fi{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--brd);font-family:sans-serif;font-size:15px;color:var(--nero);background:#fafaf8;outline:none}
textarea.fi{resize:vertical}
.tog{display:flex;gap:8px}
.tb{flex:1;padding:11px 8px;border-radius:10px;border:2px solid var(--brd);background:#fff;cursor:pointer;font-family:sans-serif;font-size:13px;font-weight:600;color:#666;text-align:center}
.tb.on{border-color:var(--oro);background:var(--oro-l);color:var(--nero)}
.row2{display:flex;gap:10px;align-items:center}
.qinp{width:60px;text-align:center;font-family:sans-serif;font-size:20px;font-weight:700;border:1px solid var(--brd);border-radius:10px;padding:6px 2px;background:#fafaf8;color:var(--nero);outline:none}
.qb{width:44px;height:44px;border-radius:10px;border:1px solid var(--brd);background:#fff;cursor:pointer;font-size:24px;color:var(--nero);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;font-family:sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.ch{padding:7px 13px;border-radius:20px;border:1px solid var(--brd);background:#fff;cursor:pointer;font-family:sans-serif;font-size:13px;color:#666}
.ch.on{border:2px solid var(--oro);background:var(--oro-l);color:var(--nero);font-weight:700}
.kgbox{background:var(--oro-l);border-radius:8px;padding:10px 14px;font-family:sans-serif;font-size:14px;border:1px solid #e8d88a;margin-top:6px}
.kgbox strong{color:var(--oro)}
.prebox{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 14px;margin-top:8px}
.pretot{font-family:sans-serif;font-size:22px;font-weight:700;color:var(--nero);margin-top:4px}
.predet{font-family:sans-serif;font-size:12px;color:#666;margin-top:2px}
.subb{padding:16px;border:none;border-radius:12px;font-family:sans-serif;font-size:16px;font-weight:700;cursor:pointer;background:var(--nero);color:var(--oro);width:100%}
.subb:disabled{background:#ccc;color:#fff;cursor:not-allowed}
.canb{padding:12px;background:none;border:1px solid var(--brd);border-radius:12px;font-family:sans-serif;font-size:14px;cursor:pointer;color:#666;width:100%;margin-top:6px}
.tipo-sel{display:flex;gap:10px}
.tipo-btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--brd);background:#fff;cursor:pointer;font-family:sans-serif;font-size:14px;font-weight:600;color:#666;text-align:center}
.tipo-btn.on-t{border-color:var(--oro);background:var(--oro-l);color:var(--nero)}
.tipo-btn.on-s{border-color:#d97706;background:#fffbeb;color:#92400e}
.sec-card{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec-card.t{background:#fffdf5;border:1px solid #e8d88a}
.sec-card.s{background:#fffbeb;border:1px solid #fde68a}
.stitle{font-family:sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#888;padding-bottom:8px;border-bottom:1px solid var(--brd);margin-bottom:2px}
.stitle.t{color:var(--oro)}.stitle.s{color:#d97706}
</style>
</head>
<body>

<div id="login">
  <div class="ls">Pasticceria Artigianale</div>
  <div class="lt">Fagotti</div>
  <div class="ls">Accesso riservato al team</div>
  <input class="li" type="password" id="pwd" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="off">
  <div class="le" id="lerr"></div>
  <button class="lb" id="btn-login">Entra &rarr;</button>
</div>

<div id="app">
  <div class="hdr">
    <div><div class="hs">Pasticceria Artigianale</div><div class="ht">Fagotti &mdash; Ordini</div></div>
    <div class="sy"><span id="sdot" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;flex-shrink:0"></span><span id="slbl" style="color:#f59e0b;font-family:sans-serif;font-size:11px">...</span></div>
  </div>
  <div class="nav">
    <button class="nb on" id="t0" onclick="goTab(0)">&#128197; Agenda</button>
    <button class="nb" id="t1" onclick="goTab(1)">&#127874; Produzione</button>
    <button class="nb" id="t2" onclick="goTab(2)">&#xFF0B; Ordine</button>
  </div>
  <div class="content">
    <div id="v0" class="view on"><div style="text-align:center;padding:40px;color:#aaa;font-family:sans-serif">Connessione...</div></div>
    <div id="v1" class="view"></div>
    <div id="v2" class="view">
      <div class="fw">
        <div class="fh"><span id="ftitle">NUOVO ORDINE</span></div>
        <div class="fb">
          <div><label class="fl">Cliente *</label><input id="fc" class="fi" type="text" placeholder="Nome del cliente" oninput="ub()"></div>
          <div><label class="fl">Telefono</label><input id="ftel" class="fi" type="tel" placeholder="+39 ..."></div>
          <div><label class="fl">Data consegna *</label><input id="fdata" class="fi" type="date"></div>
          <div>
            <label class="fl">Modalit&agrave;</label>
            <div class="tog">
              <button id="btn-ritiro" class="tb on" onclick="setConsegna(false)">&#127978; Ritiro</button>
              <button id="btn-cons" class="tb" onclick="setConsegna(true)">&#128663; Consegna (+&euro;10)</button>
            </div>
          </div>
          <div>
            <label class="fl">Cosa ordina? (anche entrambi)</label>
            <div class="tipo-sel">
              <button id="tipo-t" class="tipo-btn" onclick="togTipo('t')">&#127874; Torta / Dolce</button>
              <button id="tipo-s" class="tipo-btn" onclick="togTipo('s')">&#127973; Salato</button>
            </div>
          </div>
          <!-- TORTA -->
          <div id="sec-t" style="display:none">
            <div class="sec-card t">
              <div class="stitle t">&#127874; Torta / Dolce</div>
              <div><label class="fl">Prodotto</label>
                <input id="fprod" class="fi" type="text" list="dl-t" placeholder="Es: Tiramisù, Sacher..." autocomplete="off" oninput="onTChange()" onchange="onTChange()">
                <datalist id="dl-t"><option>Afrodite</option><option>Black Forest</option><option>Brownie</option><option>Caprese</option><option>Cestino Fagottini</option><option>Charlotte cioccolato</option><option>Charlotte limone</option><option>Cheesecake</option><option>Cream tart</option><option>Crema al burro</option><option>Crostata marmellata</option><option>Crostata cioccolato</option><option>Crostata ricotta</option><option>Crostata frutta</option><option>Diplomatica</option><option>Dolce castagne</option><option>Dolce arachidi/nocciole</option><option>Dolce Fagotti</option><option>Dolce Ilaria</option><option>Kinder</option><option>Lemon tart</option><option>Mandarinoir</option><option>Marika</option><option>Meringata cioccolato/fragole</option><option>Meringata frutti bosco</option><option>Meringata limone/castagne</option><option>Millefoglie classico</option><option>Millefoglie frutti bosco</option><option>Millefoglie fragole</option><option>Mimosa</option><option>Montblanc</option><option>Moretta</option><option>Ohana</option><option>Pasta zucchero</option><option>Pastiera</option><option>Pavlova</option><option>Profitterole</option><option>Red Velvet</option><option>Sacher</option><option>Saint Honorè</option><option>Serendipity</option><option>Settembrina</option><option>Struffoli</option><option>Sveva</option><option>Tiramisù classico</option><option>Tiramisù fragole</option><option>Tre cioccolati</option><option>Tronchetto Natale</option><option>Ugly cake</option><option>Zuccotto</option><option>Torta Gelato</option><option>Zuppa inglese</option><option>Cornetto vuoto</option><option>Cornetto crema</option><option>Cornetto cioccolato</option><option>Cornetto marmellata</option><option>Fagottino</option><option>Bignè</option><option>Pasticcino misto</option><option>Cannolo</option><option>Macaron</option><option>Croissant</option><option>Mignon misto</option><option>Tartelletta frutta</option></datalist>
              </div>
              <div><label class="fl">N&deg; torte</label>
                <div class="row2">
                  <button class="qb" onclick="adjN('qt',-1)">&#8722;</button>
                  <input type="number" id="disp-qt" class="qinp" min="1" value="1" oninput="setN('qt',this.value)">
                  <button class="qb" onclick="adjN('qt',1)">+</button>
                  <span style="font-family:sans-serif;font-size:13px;color:#888" id="lbl-t">torta</span>
                </div>
              </div>
              <div><label class="fl">Formato</label>
                <div class="tog" style="margin-bottom:8px">
                  <button id="btn-kg" class="tb on" onclick="setModo(true)">&#128207; Per kg</button>
                  <button id="btn-pers" class="tb" onclick="setModo(false)">&#128101; Per persone</button>
                </div>
                <div id="sec-kg">
                  <div class="chips" id="chips-peso">
                    <button class="ch" onclick="setPeso(this,'500g')">500g</button><button class="ch on" onclick="setPeso(this,'1kg')">1kg</button><button class="ch" onclick="setPeso(this,'1.5kg')">1.5kg</button><button class="ch" onclick="setPeso(this,'2kg')">2kg</button><button class="ch" onclick="setPeso(this,'2.5kg')">2.5kg</button><button class="ch" onclick="setPeso(this,'3kg')">3kg</button><button class="ch" onclick="setPeso(this,'4kg')">4kg</button><button class="ch" onclick="setPeso(this,'5kg')">5kg</button>
                  </div>
                </div>
                <div id="sec-pers" style="display:none;margin-top:8px">
                  <div class="row2" style="margin-bottom:8px">
                    <button class="qb" onclick="adjN('pe',-1,2)">&#8722;</button>
                    <input type="number" id="disp-pe" class="qinp" min="2" value="8" oninput="setN('pe',this.value)">
                    <button class="qb" onclick="adjN('pe',1)">+</button>
                  </div>
                  <div style="font-family:sans-serif;font-size:13px;color:#666;margin-bottom:4px">Porzione: <span id="lbl-g">150</span>g/persona</div>
                  <input type="range" style="width:100%;accent-color:var(--oro);margin:6px 0" id="sl-g" min="120" max="170" step="5" value="150" oninput="updG(this.value)">
                  <div style="display:flex;justify-content:space-between;font-family:sans-serif;font-size:11px;color:#bbb"><span>120g</span><span>150g</span><span>170g</span></div>
                  <div class="kgbox" id="kgbox">8 pers &times; 150g = <strong>~1.20 kg</strong></div>
                </div>
              </div>
              <div><label class="fl">Prezzo &euro;/kg <span id="lbl-lk" style="font-weight:400;color:#aaa"></span></label>
                <input id="fpk" class="fi" type="number" step="0.5" placeholder="&euro;/kg" oninput="updP()">
                <div id="pbox" style="display:none" class="prebox">
                  <div style="font-family:sans-serif;font-size:11px;color:#0369a1;text-transform:uppercase;letter-spacing:1px">Preventivo torta</div>
                  <div class="pretot" id="ptot">&euro; 0.00</div>
                  <div class="predet" id="pdet"></div>
                </div>
              </div>
              <div><label class="fl">Farcitura</label><input id="ffar" class="fi" type="text" placeholder="Es: fragole, pistacchio..."></div>
              <div><label class="fl">Decorazione / Scritta</label><input id="fdec" class="fi" type="text" placeholder="Es: Buon compleanno Marco..."></div>
            </div>
          </div>
          <!-- SALATO -->
          <div id="sec-s" style="display:none">
            <div class="sec-card s">
              <div class="stitle s">&#127973; Salato</div>
              <div><label class="fl">Prodotto salato</label>
                <input id="fsprod" class="fi" type="text" list="dl-s" placeholder="Es: Pizzette, Tramezzini..." autocomplete="off" oninput="onSChange()" onchange="onSChange()">
                <datalist id="dl-s"><option>Bottoncini/cornettini/genovesi</option><option>Pizzette/rustici</option><option>Torte rustiche</option><option>Tramezzini mignon</option><option>Mini supplì/crocchette</option><option>Pan Brioche (30 pz)</option><option>Bignè fritti ripieni</option><option>Tartine/panzerottini</option><option>Pain suisse</option></datalist>
              </div>
              <!-- a kg -->
              <div id="sec-skg" style="display:none;flex-direction:column;gap:10px">
                <div><label class="fl">Peso</label>
                  <div class="chips" id="chips-s">
                    <button class="ch" onclick="setSP(this,'0.5kg')">0.5kg</button><button class="ch on" onclick="setSP(this,'1kg')">1kg</button><button class="ch" onclick="setSP(this,'1.5kg')">1.5kg</button><button class="ch" onclick="setSP(this,'2kg')">2kg</button><button class="ch" onclick="setSP(this,'3kg')">3kg</button><button class="ch" onclick="setSP(this,'4kg')">4kg</button><button class="ch" onclick="setSP(this,'5kg')">5kg</button>
                  </div>
                </div>
                <div><label class="fl">Prezzo &euro;/kg <span id="lbl-slk" style="font-weight:400;color:#aaa"></span></label>
                  <input id="fspk" class="fi" type="number" step="0.5" placeholder="&euro;/kg" oninput="updSP()">
                  <div id="spbox" style="display:none" class="prebox">
                    <div style="font-family:sans-serif;font-size:11px;color:#d97706;text-transform:uppercase;letter-spacing:1px">Preventivo salato</div>
                    <div class="pretot" id="sptot" style="color:#92400e">&euro; 0.00</div>
                    <div class="predet" id="spdet"></div>
                  </div>
                </div>
              </div>
              <!-- a pz -->
              <div id="sec-spz" style="display:none;flex-direction:column;gap:10px">
                <div><label class="fl">Quantit&agrave; (pezzi)</label>
                  <div class="row2">
                    <button class="qb" onclick="adjN('sq',-1)">&#8722;</button>
                    <input type="number" id="disp-sq" class="qinp" min="1" value="1" oninput="setN('sq',this.value)">
                    <button class="qb" onclick="adjN('sq',1)">+</button>
                    <span style="font-family:sans-serif;font-size:13px;color:#888">pz</span>
                  </div>
                </div>
                <div><label class="fl">Prezzo &euro;/pz <span id="lbl-spz" style="font-weight:400;color:#aaa"></span></label>
                  <input id="fsppz" class="fi" type="number" step="0.1" placeholder="&euro;/pz" oninput="updSPz()">
                  <div id="spzbox" style="display:none" class="prebox">
                    <div style="font-family:sans-serif;font-size:11px;color:#d97706;text-transform:uppercase;letter-spacing:1px">Preventivo salato</div>
                    <div class="pretot" id="spztot" style="color:#92400e">&euro; 0.00</div>
                    <div class="predet" id="spzdet"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div><label class="fl">Note foto / riferimento</label><input id="fnref" class="fi" type="text" placeholder="Es: foto WhatsApp, @instagram..."></div>
          <div><label class="fl">Note aggiuntive</label><textarea id="fnote" class="fi" rows="2" placeholder="Allergie, orario, richieste..."></textarea></div>
          <button id="sbtn" class="subb" onclick="doSub()" disabled>&#10003; Aggiungi ordine</button>
          <button id="cbtn" class="canb" style="display:none" onclick="goAgenda()">Annulla</button>
        </div>
      </div>
    </div>

function calcTot(o){
  var tot=0;
  if(o.prodotto){
    var pk=parseFloat(o.prezzoKg)||LISTINO[o.prodotto]||0;
    var kg=o.modoKg?p2kg(o.peso||"1kg")*(o.qtaTorte||1):cKg(o.persone||8,o.grammi||150)*(o.qtaTorte||1);
    tot+=pk*kg;
  }
  if(o.salProdotto){
    if(o.salModo==="kg") tot+=(parseFloat(o.salPrezzoKg)||0)*p2kg(o.salPeso||"1kg");
    else tot+=(parseFloat(o.salPrezzoPz)||0)*(o.salQta||1);
  }
  if(o.consegna) tot+=10;
  return tot;
}

// ── PRODUZIONE ──
function renderP(){
  var dates=wDates(wOff);
  var h='<div class="wnav"><button class="wb" onclick="chW(-1)">&#8249;</button><div class="wt"><div class="wm">Piano di produzione</div><div class="wd">'+fdf(dates[0])+" &mdash; "+fdf(dates[6])+'</div></div><button class="wb" onclick="chW(1)">&#8250;</button></div>';
  var totM={}, any=false;
  dates.forEach(function(date,i){
    var day=opg(date); if(!day.length)return; any=true;
    var bp={};
    day.forEach(function(o){
      function addKey(k,q){if(!bp[k])bp[k]=[];bp[k].push(o);totM[k]=(totM[k]||0)+q;}
      if(o.prodotto) addKey(o.prodotto, o.qtaTorte||1);
      if(o.salProdotto) addKey(o.salProdotto, o.salModo==="pz"?(o.salQta||1):1);

      var items=bp[prod], tq=items.reduce(function(s,o){return s+(o.prodotto===prod?(o.qtaTorte||1):(o.salModo==="pz"?(o.salQta||1):1));},0);

      items.forEach(function(o){

        if(o.salProdotto===prod){det.push(o.salModo==="kg"?(o.salPeso||"1kg"):(o.salQta||1)+" pz");}

        if(o.decorazione)det.push("dec: "+o.decorazione);
        if(o.consegna)det.push("🚗");
        var tot2=calcTot(o);
        h+='<div class="pdt">— '+xe(o.cliente)+(det.length?' · <span>'+det.join(" · ")+'</span>':'')+(tot2>0?' · <span>€'+tot2.toFixed(2)+'</span>':'')+'</div>';
      });
      h+='</div>';
    });
    h+='</div>';
  });
  if(!any)h+='<div style="text-align:center;padding:40px;color:#ccc;font-family:sans-serif">Nessun ordine</div>';
  if(Object.keys(totM).length){
    var te=ordini.filter(function(o){return dates.indexOf(o.data)>=0;}).reduce(function(s,o){return s+calcTot(o);},0);

  if(t==="pe"){fPersone=Math.max(mn,fPersone+d);var e2=G("disp-pe");if(e2)e2.value=fPersone;updKgB();updP();}

function updG(v){fGrammi=parseInt(v);G("lbl-g").textContent=fGrammi;updKgB();updP();}

  var p=G("fprod").value.trim(); if(!p){G("pbox").style.display="none";return;}

    if(G("fsppz"))G("fsppz").value=o.salPrezzoPz||"";
    var es=G("disp-sq");if(es)es.value=fSalQta;
    document.querySelectorAll("#chips-s .ch").forEach(function(c){c.classList.toggle("on",c.textContent===fSalPeso);});
    onSChange();
  }
  G("tipo-t").className="tipo-btn"+(fHasT?" on-t":"");
  G("tipo-s").className="tipo-btn"+(fHasS?" on-s":"");
  G("sec-t").style.display=fHasT?"block":"none";
  G("sec-s").style.display=fHasS?"block":"none";
  G("sbtn").disabled=false; G("sbtn").textContent="✓ Salva modifiche";
  G("cbtn").style.display="block"; G("ftitle").textContent="MODIFICA ORDINE";
  G("t2").textContent="✏️ Modifica"; goTab(2);
}
function resetForm(){
  G("fc").value=""; G("ftel").value=""; G("fdata").value=td();
  G("fnref").value=""; G("fnote").value="";
  fConsegna=false; fHasT=false; fHasS=false;
  fModoKg=true; fPeso="1kg"; fPersone=8; fGrammi=150; fQtT=1; fSalPeso="1kg"; fSalQta=1;
  G("btn-ritiro").classList.add("on"); G("btn-cons").classList.remove("on");
  G("tipo-t").className="tipo-btn"; G("tipo-s").className="tipo-btn";
  G("sec-t").style.display="none"; G("sec-s").style.display="none";
  G("sec-skg").style.display="none"; G("sec-spz").style.display="none";
  G("pbox").style.display="none"; G("spbox").style.display="none"; G("spzbox").style.display="none";
  try{
    G("fprod").value=""; G("fpk").value=""; G("ffar").value=""; G("fdec").value="";
    G("fsprod").value=""; G("fspk").value=""; if(G("fsppz"))G("fsppz").value="";
    var eq=G("disp-qt");if(eq)eq.value=1; var ep=G("disp-pe");if(ep)ep.value=8; var es=G("disp-sq");if(es)es.value=1;
    document.querySelectorAll("#chips-peso .ch").forEach(function(c){c.classList.toggle("on",c.textContent==="1kg");});
    document.querySelectorAll("#chips-s .ch").forEach(function(c){c.classList.toggle("on",c.textContent==="1kg");});
    G("btn-kg").classList.add("on"); G("btn-pers").classList.remove("on");
    G("sec-kg").style.display="block"; G("sec-pers").style.display="none";
    G("lbl-t").textContent="torta"; G("lbl-g").textContent="150"; G("sl-g").value=150;
    G("kgbox").innerHTML="8 pers × 150g = <strong>~1.20 kg</strong>";
    G("lbl-lk").textContent=""; G("lbl-slk").textContent=""; G("lbl-spz").textContent="";
  }catch(err){}
  G("sbtn").disabled=true; G("sbtn").textContent="✓ Aggiungi ordine";
  G("cbtn").style.display="none"; G("ftitle").textContent="NUOVO ORDINE"; editId=null;
}
